<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiados">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Bodega — Fiados</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#7C3AED;--purple-bg:#EDE9FE;--purple-dark:#5B21B6;--purple-light:#A78BFA;
  --green:#166534;--green-bg:#DCFCE7;--green-mid:#16a34a;
  --red:#991B1B;--red-bg:#FEE2E2;
  --amber:#92400E;--amber-bg:#FEF3C7;
  --bg:#fff;--bg2:#f8f7f6;--bg3:#eeece9;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#a8a8a8;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);
  --radius:10px;--radius-lg:14px;--shadow:0 1px 4px rgba(0,0,0,0.07);
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --num:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.20);
  --purple:#A78BFA;--purple-bg:#2D1B69;--purple-dark:#C4B5FD;
  --green:#4ADE80;--green-bg:#14532D;--green-mid:#22c55e;
  --red:#F87171;--red-bg:#450A0A;--amber:#FCD34D;--amber-bg:#451A03;
}}
html,body{height:100%;font-family:var(--ui);background:var(--bg);color:var(--text)}
.app{display:flex;flex-direction:column;height:100%;max-width:700px;margin:0 auto}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.section{display:none}.section.active{display:block}
/* HEADER */
.header{background:var(--purple);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;flex-shrink:0}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.header h1{font-size:18px;font-weight:700}
.header-date{font-size:11px;opacity:.70;margin-top:2px}
.sync-badge{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,0.18);display:flex;align-items:center;gap:5px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#6ee7b7}
.sync-dot.off{background:#fca5a5}.sync-dot.loading{background:#fcd34d;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.header-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding-bottom:14px}
.hm{background:rgba(255,255,255,0.14);border-radius:10px;padding:9px 6px;text-align:center}
.hm-label{font-size:10px;opacity:.78;margin-bottom:2px}
.hm-value{font-size:17px;font-weight:700;font-family:var(--num)}
/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:68px;padding:12px 4px;font-size:11px;font-weight:600;font-family:var(--ui);text-align:center;cursor:pointer;border:none;background:none;color:var(--text3);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s}
.tab.active{color:var(--purple);border-bottom-color:var(--purple)}
/* CARD / FORM */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:15px;font-family:var(--ui);background:var(--bg2);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--purple);background:var(--bg);box-shadow:0 0 0 3px rgba(124,58,237,0.10)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:none;line-height:1.5}
/* AUTOCOMPLETE */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:200;max-height:200px;overflow-y:auto;display:none;box-shadow:0 6px 20px rgba(0,0,0,0.13)}
.ac-item{padding:11px 14px;font-size:14px;cursor:pointer;color:var(--text);border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ac-item:last-child{border-bottom:none}.ac-item:active,.ac-item:hover{background:var(--bg2)}
.ac-sub{font-size:11px;color:var(--text2)}.ac-new{font-size:11px;color:var(--purple);font-weight:700}
/* BUTTONS */
.btn{padding:12px;border-radius:var(--radius);font-size:14px;font-weight:700;font-family:var(--ui);border:none;width:100%;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{opacity:.82;transform:scale(.98)}
.btn-primary{background:var(--purple);color:#fff}
.btn-outline{background:none;border:0.5px solid var(--border2);color:var(--text2);margin-top:8px;font-weight:500}
.btn-danger{background:var(--red-bg);color:var(--red);margin-top:8px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn-sm{padding:5px 10px;font-size:11px;font-family:var(--ui);border:0.5px solid var(--border);background:none;color:var(--text2);border-radius:7px;cursor:pointer;white-space:nowrap}
.btn-abonar{padding:6px 13px;font-size:12px;border:none;background:var(--green-bg);color:var(--green);border-radius:8px;cursor:pointer;font-weight:700;font-family:var(--ui)}
.btn-receipt{padding:6px 13px;font-size:12px;border:none;background:var(--purple-bg);color:var(--purple);border-radius:8px;cursor:pointer;font-weight:700;font-family:var(--ui)}
/* VISITA BLOCKS */
.visita-block{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:10px}
.visita-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.visita-title{font-size:12px;font-weight:700;color:var(--purple)}
.visita-remove{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:5px}
.visita-remove:active{background:var(--red-bg);color:var(--red)}
.item-row{display:grid;grid-template-columns:1fr 90px 32px;gap:6px;align-items:center;margin-bottom:6px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.item-row input{font-size:14px;padding:8px 10px}
.item-remove{width:32px;height:36px;border:0.5px solid var(--border);background:none;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.item-remove:active{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.btn-add-item{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:1px dashed var(--border2);background:none;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:12px;font-weight:600;font-family:var(--ui);width:100%;margin-top:2px;transition:all .15s}
.btn-add-item:active{border-color:var(--purple);color:var(--purple);background:var(--purple-bg)}
.visita-subtotal{display:flex;justify-content:flex-end;font-size:12px;color:var(--text2);margin-top:7px;padding-top:6px;border-top:0.5px dashed var(--border2)}
.visita-subtotal strong{color:var(--text);margin-left:5px;font-family:var(--num)}
.btn-add-visita{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border:1.5px dashed var(--purple-light);background:var(--purple-bg);border-radius:var(--radius);cursor:pointer;color:var(--purple);font-size:13px;font-weight:700;font-family:var(--ui);width:100%;margin:8px 0;transition:all .15s}
.total-dia{display:flex;justify-content:space-between;align-items:center;background:var(--purple-bg);border-radius:var(--radius);padding:11px 14px;margin:10px 0 4px;border:0.5px solid rgba(124,58,237,0.20)}
.total-dia-label{font-size:12px;font-weight:700;color:var(--purple-dark);text-transform:uppercase;letter-spacing:.4px}
.total-dia-value{font-size:20px;font-weight:700;color:var(--purple);font-family:var(--num)}
/* CLIENTES */
.search-box{margin-bottom:14px}
.cliente-card{border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.cliente-header{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;cursor:pointer;gap:8px;transition:background .12s}
.cliente-header:active{background:var(--bg2)}
.cliente-avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.cliente-info{flex:1;min-width:0}
.cliente-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cliente-meta{font-size:11px;color:var(--text2);margin-top:2px}
.cliente-deuda{text-align:right;flex-shrink:0}
.deuda-monto{font-size:17px;font-weight:700;color:var(--red);font-family:var(--num)}
.deuda-label{font-size:10px;color:var(--text3)}
.cliente-body{display:none;border-top:0.5px solid var(--border)}
/* CUENTAS */
.cuenta-block{border-bottom:0.5px solid var(--border)}
.cuenta-block:last-child{border-bottom:none}
.cuenta-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);cursor:pointer}
.cuenta-header:active{opacity:.8}
.cuenta-num{font-size:12px;font-weight:700;color:var(--text)}
.cuenta-estado{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;margin-left:6px}
.cuenta-estado.activa{background:var(--purple-bg);color:var(--purple)}
.cuenta-estado.cerrada{background:var(--bg3);color:var(--text3)}
.cuenta-estado.pendiente{background:var(--amber-bg);color:var(--amber)}
.cuenta-resumen{font-size:11px;color:var(--text2);margin-top:2px}
.cuenta-saldo-monto{font-size:15px;font-weight:700;font-family:var(--num)}
.cuenta-saldo-monto.positivo{color:var(--red)}.cuenta-saldo-monto.saldado{color:var(--green)}
.cuenta-body{display:none}
.progress-wrap{padding:8px 14px;border-bottom:0.5px solid var(--border)}
.progress-bar{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:4px 0 2px}
.progress-fill{height:100%;border-radius:99px;background:var(--green-mid);transition:width .4s ease}
.progress-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
.abono-row{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-bottom:0.5px solid var(--border);font-size:12px}
.abono-monto{color:var(--green);font-weight:700;font-family:var(--num)}
.abono-fecha{color:var(--text2)}.abono-nota{font-size:11px;color:var(--text3)}
.dia-grupo-header{padding:7px 14px;background:var(--bg2);border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dia-grupo-fecha{font-size:12px;font-weight:700;font-family:var(--num)}
.dia-grupo-info{font-size:11px;color:var(--text2)}
.dia-grupo-total{font-size:12px;font-weight:700;color:var(--red);font-family:var(--num)}
.visita-row{border-bottom:0.5px solid var(--border)}.visita-row:last-child{border-bottom:none}
.visita-row-header{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;cursor:pointer}
.visita-row-header:active{background:var(--bg2)}
.visita-label-txt{font-size:12px;font-weight:600;color:var(--text2)}
.visita-nprod{font-size:11px;color:var(--text3);margin-top:1px}
.visita-monto{font-size:14px;font-weight:700;color:var(--red);font-family:var(--num)}
.visita-items-list{padding:0 14px 10px 28px;display:none}
.visita-item-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--text2);border-bottom:0.5px solid var(--border)}
.visita-item-line:last-child{border-bottom:none}
.visita-item-line span:last-child{font-family:var(--num);font-weight:600;color:var(--text);flex-shrink:0;margin-left:8px}
.visita-edit-bar{display:flex;justify-content:flex-end;padding:5px 14px 8px}
.cuenta-footer{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;border-top:0.5px solid var(--border);background:var(--bg2)}
.alert-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600;flex-shrink:0}
.alert-badge.danger{background:var(--red-bg);color:var(--red)}
.alert-badge.warn{background:var(--amber-bg);color:var(--amber)}
.tag-pagado{background:var(--green-bg);color:var(--green);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 8px;font-size:10px;font-weight:600;color:var(--text2);border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:.5px;background:var(--bg2)}
td{padding:9px 8px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
/* MODALES */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.40);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-sheet{background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 16px;width:100%;max-width:700px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px}
.modal-overlay.centered{align-items:center;padding:16px}
.modal-box{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-box-header{padding:13px 16px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-box-header span{font-size:14px;font-weight:700}
.modal-close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.modal-box-body{padding:14px 16px}
/* RECIBO */
#recibo-content{background:#fff;padding:28px 24px;font-family:var(--serif);color:#1a1a1a}
.rec-titulo{font-size:18px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.rec-hr{border:none;border-top:2px dashed #bbb;margin:10px 0 14px}
.rec-cliente{font-size:14px;margin-bottom:4px}
.rec-cliente strong{font-weight:700}
.rec-cuenta-num{font-size:12px;color:#888;margin-bottom:14px;font-style:italic}
.rec-dia{margin-bottom:1px}
.rec-dia-header{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0 5px;border-bottom:1.5px solid #333}
.rec-dia-fecha{font-size:13px;font-weight:700;font-family:var(--num)}
.rec-dia-nvisitas{font-size:10px;color:#999;font-style:italic;margin-left:5px;font-weight:400}
.rec-dia-total{font-size:13px;font-weight:700;font-family:var(--num)}
.rec-visita{padding:5px 0 5px 10px;border-bottom:0.5px solid #eee}
.rec-visita:last-child{border-bottom:0.5px solid #ddd}
.rec-visita-label{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.rec-productos{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px}
.rec-prod-item{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;border-bottom:0.5px solid #f5f5f5}
.rec-prod-item:last-child{border-bottom:none}
.rec-prod-name{font-size:11px;color:#333;font-family:var(--serif)}
.rec-prod-price{font-size:11px;color:#666;font-weight:600;white-space:nowrap;padding-left:4px;font-family:var(--num)}
.rec-visita-sub{display:flex;justify-content:flex-end;font-size:10px;color:#999;padding:3px 0 1px;border-top:0.5px dashed #ddd;margin-top:3px}
.rec-visita-sub span{margin-left:4px;font-weight:700;color:#666;font-family:var(--num)}
.rec-abono-section{margin-top:10px;border-top:1px dashed #ccc;padding-top:8px}
.rec-abono-title{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.rec-abono-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.rec-abono-row span:last-child{font-family:var(--num);color:#166534;font-weight:600}
.rec-total-wrap{background:#f0f0f0;border-radius:7px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.rec-total-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rec-total-monto{font-size:22px;font-weight:700;font-family:var(--num)}
.rec-gracias{text-align:center;font-size:12px;color:#999;margin-top:12px;font-style:italic}
/* ANALISIS */
.analisis-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.analisis-filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:99px;border:0.5px solid var(--border2);background:none;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:var(--ui);transition:all .15s}
.filter-btn.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.filter-range{display:none;gap:8px;margin-bottom:14px}
.filter-range.show{display:flex}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 14px;border:0.5px solid var(--border)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:20px;font-weight:700;font-family:var(--num)}
.stat-value.red{color:var(--red)}.stat-value.green{color:var(--green)}.stat-value.amber{color:var(--amber)}.stat-value.purple{color:var(--purple)}
.analisis-table{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
/* UTILS */
.empty{text-align:center;color:var(--text2);font-size:13px;padding:2rem 0}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.30);display:none;align-items:center;justify-content:center;z-index:999}
.loading-box{background:var(--bg);border-radius:var(--radius-lg);padding:24px 32px;text-align:center;font-size:14px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:1000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.divider{border:none;border-top:0.5px solid var(--border);margin:12px 0}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div><h1>Fiados</h1><div class="header-date" id="hdr-date"></div></div>
      <div class="sync-badge"><div class="sync-dot loading" id="sync-dot"></div><span id="sync-txt">Conectando...</span></div>
    </div>
    <div class="header-metrics">
      <div class="hm"><div class="hm-label">Clientes</div><div class="hm-value" id="h-clientes">0</div></div>
      <div class="hm"><div class="hm-label">Pendiente</div><div class="hm-value" id="h-total">S/0</div></div>
      <div class="hm"><div class="hm-label">Alertas</div><div class="hm-value" id="h-alertas">0</div></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="swTab('fiados')">Fiados</button>
    <button class="tab" onclick="swTab('nuevo')">+ Nuevo</button>
    <button class="tab" onclick="swTab('historial')">Pagados</button>
    <button class="tab" onclick="swTab('analisis')">Análisis</button>
  </div>

let clientes=[],cuentas=[],visitas=[],items=[],pagos=[],reciboData=null,filtroActual='hoy';

function colorAvatar(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h];}
function diasSinMov(cliId){

}

function setSync(s){const d=document.getElementById('sync-dot'),t=document.getElementById('sync-txt');d.className='sync-dot'+(s==='on'?'':s==='off'?' off':' loading');t.textContent=s==='on'?'Sincronizado':s==='off'?'Sin conexión':'Sincronizando...';}

async function sbFetch(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(SB_URL+'/rest/v1/'+path,opts);
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();return txt?JSON.parse(txt):[];
}
document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function acCliente(){
  const val=document.getElementById('f-cliente').value.trim().toLowerCase();
  const list=document.getElementById('ac-cliente');
  const act=clientes.filter(c=>c.estado==='activo');
  const m=val===''?act:act.filter(c=>c.nombre.toLowerCase().includes(val));
  const hl=(t,q)=>{if(!q)return t;const i=t.toLowerCase().indexOf(q);if(i<0)return t;return t.slice(0,i)+'<strong style="color:var(--purple)">'+t.slice(i,i+q.length)+'</strong>'+t.slice(i+q.length);};
  let html=m.map(c=>`<div class="ac-item" onmousedown="selCliente(${c.id},'${c.nombre.replace(/'/g,"\\'")}','${(c.telefono||'').replace(/'/g,"\\'")}')">
    ${hl(c.nombre,val)}<span class="ac-sub">Saldo ${fmt(saldoCli(c.id))}</span></div>`).join('');

  list.innerHTML=html;list.style.display=html?'block':'none';
}

async function registrarFiado(){
  const nombreRaw=document.getElementById('f-cliente').value.trim();
  if(!nombreRaw){alert('Escribe el nombre del cliente');return;}
  const nombre=cap(nombreRaw);
  const tel=document.getElementById('f-tel').value.trim();
  const fecha=document.getElementById('f-fecha').value;
  const visitasData=[];
  for(const bloque of document.querySelectorAll('#visitas-container .visita-block')){
    const its=[];
    bloque.querySelectorAll('.item-row').forEach(row=>{
      const[ip,ipr]=row.querySelectorAll('input');
      const prod=cap(ip.value.trim()),prec=parseFloat(ipr.value)||0;
      if(prod&&prec>0)its.push({producto:prod,precio:prec});
    });
    if(its.length>0)visitasData.push({items:its,total_visita:its.reduce((s,it)=>s+it.precio,0)});
  }
  if(!visitasData.length){alert('Agrega al menos un producto con precio');return;}
  const totalDia=visitasData.reduce((s,v)=>s+v.total_visita,0);
  showLoading('Registrando fiado...');setSync('loading');
  try{
    let cliId=parseInt(document.getElementById('f-cliente').dataset.id)||null;
    let cli=clientes.find(c=>c.id===cliId);
    if(!cli)cli=clientes.find(c=>c.nombre.toLowerCase()===nombre.toLowerCase()&&c.estado==='activo');
    if(!cli){cli=first(await sbFetch('clientes','POST',{nombre,telefono:tel||null,estado:'activo'}));clientes.push(cli);}
    else if(tel&&tel!==cli.telefono){await sbFetch(`clientes?id=eq.${cli.id}`,'PATCH',{telefono:tel});cli.telefono=tel;}
    // Solo buscar cuenta ACTIVA — nunca usar pendiente ni pagada para nuevos fiados
    let cuenta=cuentas.find(c=>c.cliente_id===cli.id&&c.estado==='activa');
    if(!cuenta){
      const n=cuentas.filter(c=>c.cliente_id===cli.id).length;
      cuenta=first(await sbFetch('cuentas','POST',{cliente_id:cli.id,numero:n+1,estado:'activa',total_fiado:0,monto_abonado:0,saldo:0}));
      cuentas.push(cuenta);
    }
    for(const vData of visitasData){
      const v=first(await sbFetch('visitas','POST',{cuenta_id:cuenta.id,fecha,total_visita:vData.total_visita}));visitas.push(v);
      for(const it of vData.items){items.push(first(await sbFetch('items_visita','POST',{visita_id:v.id,producto:it.producto,precio:it.precio})));}
    }
    const nt=parseFloat(cuenta.total_fiado||0)+totalDia,ns=nt-parseFloat(cuenta.monto_abonado||0);
    await sbFetch(`cuentas?id=eq.${cuenta.id}`,'PATCH',{total_fiado:nt,saldo:ns});
    cuenta.total_fiado=nt;cuenta.saldo=ns;
    setSync('on');showToast('✓ Fiado registrado — '+fmt(totalDia));
    limpiarFormulario();renderClientes();updateHeader();swTab('fiados');
  }catch(e){setSync('off');showToast('Error: '+e.message);}
  hideLoading();
}
function renderClientes(){
  const buscar=document.getElementById('buscar').value.trim().toLowerCase();
  const act=clientes.filter(c=>c.estado==='activo'&&(!buscar||c.nombre.toLowerCase().includes(buscar))).sort((a,b)=>saldoCli(b.id)-saldoCli(a.id));
  const cont=document.getElementById('lista-clientes');
  if(!act.length){cont.innerHTML='<p class="empty">Sin clientes con fiado activo</p>';return;}
  cont.innerHTML=act.map(c=>{
    const saldo=saldoCli(c.id),dias=diasSinMov(c.id);
    const alerta=dias>=14?`<span class="alert-badge danger">+${dias}d</span>`:dias>=7?`<span class="alert-badge warn">${dias}d</span>`:'';
    const nc=cuentas.filter(cc=>cc.cliente_id===c.id&&(cc.estado==='activa'||cc.estado==='pendiente')).length;
    return `<div class="cliente-card">
      <div class="cliente-header" onclick="toggleCliente(${c.id})">
        <div class="cliente-avatar" style="background:${colorAvatar(c.nombre)}">${c.nombre.charAt(0).toUpperCase()}</div>
        <div class="cliente-info">
          <div class="cliente-name">${c.nombre} ${alerta}</div>
          <div class="cliente-meta">${nc} cuenta${nc!==1?'s':''} · ${c.telefono?'📱 '+c.telefono:'Sin teléfono'}</div>
        </div>
        <div class="cliente-deuda"><div class="deuda-monto">${fmt(saldo)}</div><div class="deuda-label">saldo total</div></div>
      </div>
      <div class="cliente-body" id="body-${c.id}">
        ${renderCuentasCliente(c.id)}
        <div style="padding:10px 14px;border-top:0.5px solid var(--border);background:var(--bg2);display:flex;gap:8px">
          <button class="btn-sm" onclick="abrirEditCliente(${c.id})">✎ Editar cliente</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function renderCuentasCliente(cliId){
  // Solo mostrar cuentas activas y pendientes — las pagadas no se renderizan
  const cc=cuentas.filter(c=>c.cliente_id===cliId&&(c.estado==='activa'||c.estado==='pendiente')).sort((a,b)=>b.numero-a.numero);
  if(!cc.length)return '<p class="empty" style="padding:1rem">Sin cuentas activas</p>';
  return cc.map(cuenta=>{
    const esA=cuenta.estado==='activa';
    const esPend=cuenta.estado==='pendiente';
    const estadoLabel=esA?'Activa':esPend?'Pendiente':'';
    const estadoClass=esA?'activa':esPend?'pendiente':'';
    const pct=cuenta.total_fiado>0?Math.min(100,(parseFloat(cuenta.monto_abonado||0)/parseFloat(cuenta.total_fiado))*100):0;
    const pg=pagos.filter(p=>p.cuenta_id===cuenta.id);
    const progressHtml=parseFloat(cuenta.monto_abonado||0)>0?`
      <div class="progress-wrap">
        <div class="progress-labels"><span>Abonado ${fmt(cuenta.monto_abonado)}</span><span>${Math.round(pct)}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-labels"><span></span><span>Total ${fmt(cuenta.total_fiado)}</span></div>
      </div>`:'';
    const abonosHtml=pg.length?`
      <div style="padding:6px 14px 8px;border-bottom:0.5px solid var(--border)">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">Abonos</div>
        ${pg.map(p=>`<div class="abono-row"><div><span class="abono-fecha">${fechaDisplay(p.fecha)}</span>${p.nota?`<div class="abono-nota">${p.nota}</div>`:''}</div><span class="abono-monto">− ${fmt(p.monto)}</span></div>`).join('')}
      </div>`:'';
    return `<div class="cuenta-block">
      <div class="cuenta-header" onclick="toggleCuenta(${cuenta.id})">
        <div>
          <div class="cuenta-num">Cuenta #${cuenta.numero}<span class="cuenta-estado ${estadoClass}">${estadoLabel}</span></div>
          <div class="cuenta-resumen">${visitas.filter(v=>v.cuenta_id===cuenta.id).length} visitas · Fiado ${fmt(cuenta.total_fiado)}</div>
        </div>
        <div class="cuenta-saldo"><div class="cuenta-saldo-monto ${parseFloat(cuenta.saldo||0)>0?'positivo':'saldado'}">${fmt(cuenta.saldo)}</div><div style="font-size:10px;color:var(--text3)">saldo</div></div>
      </div>
      <div class="cuenta-body" id="cuenta-body-${cuenta.id}">
        ${progressHtml}${abonosHtml}
        ${renderVisitasCuenta(cuenta.id)}

async function registrarAbono(){
  const cuentaId=parseInt(document.getElementById('abonar-cuenta-id').value);
  const monto=parseFloat(document.getElementById('abonar-monto').value)||0;
  const fecha=document.getElementById('abonar-fecha').value;
  const nota=cap(document.getElementById('abonar-nota').value.trim());
  const cuenta=cuentas.find(c=>c.id===cuentaId);
  if(!monto||monto<=0){alert('Ingresa un monto válido');return;}
  showLoading('Registrando abono...');setSync('loading');
  try{
    // 1. Registrar el pago
    const pago=first(await sbFetch('pagos','POST',{cuenta_id:cuentaId,fecha,monto,nota:nota||null}));pagos.push(pago);
    // 2. Calcular nuevo saldo
    const na=parseFloat(cuenta.monto_abonado||0)+monto;
    const ns=Math.max(0,parseFloat(cuenta.total_fiado||0)-na);
    // 3. Estado: 'pagada' si saldo=0, 'pendiente' si saldo>0
    const nuevoEstado=ns===0?'pagada':'pendiente';
    await sbFetch(`cuentas?id=eq.${cuentaId}`,'PATCH',{monto_abonado:na,saldo:ns,estado:nuevoEstado,fecha_abono:fecha});
    cuenta.monto_abonado=na;cuenta.saldo=ns;cuenta.estado=nuevoEstado;cuenta.fecha_abono=fecha;
    // 4. Si quedó pendiente → crear nueva cuenta activa automáticamente
    if(nuevoEstado==='pendiente'){
      const nCuentas=cuentas.filter(c=>c.cliente_id===cuenta.cliente_id).length;
      const nuevaCuenta=first(await sbFetch('cuentas','POST',{
        cliente_id:cuenta.cliente_id,numero:nCuentas+1,
        estado:'activa',total_fiado:0,monto_abonado:0,saldo:0
      }));
      cuentas.push(nuevaCuenta);
    }
    // 5. Si quedó pagada y no hay más cuentas activas/pendientes → marcar cliente como pagado
    if(nuevoEstado==='pagada'){
      const tieneDeuda=cuentas.some(c=>c.cliente_id===cuenta.cliente_id&&(c.estado==='activa'||c.estado==='pendiente')&&c.id!==cuentaId);
      if(!tieneDeuda){
        await sbFetch(`clientes?id=eq.${cuenta.cliente_id}`,'PATCH',{estado:'pagado'});
        const cli=clientes.find(c=>c.id===cuenta.cliente_id);if(cli)cli.estado='pagado';
      }
    }
    setSync('on');
    showToast(nuevoEstado==='pagada'?'✓ Cuenta pagada completamente':'✓ Abono registrado — nueva cuenta activa creada');
    cerrarModal('modal-abonar');renderClientes();updateHeader();
  }catch(e){setSync('off');showToast('Error: '+e.message);}
  hideLoading();
}

function imprimirRawBT(){
  const cuenta=cuentas.find(c=>c.id===reciboData.cuentaId);
  const cli=clientes.find(c=>c.id===cuenta.cliente_id);

  const W=32, C1=15, C2=16;
  const sep=(c='-')=>c.repeat(W);
  const ctr=s=>{s=s.slice(0,W);const p=Math.floor((W-s.length)/2);return ' '.repeat(p)+s;};
  const lineRL=(l,r)=>{const max=W-r.length-1;return l.slice(0,max).padEnd(max)+' '+r;};
  const fmtCol=(nombre,precio,colW)=>{
    const pr='S/'+fmtNum(precio);
    const max=colW-pr.length-1;
    return nombre.slice(0,max).padEnd(max)+' '+pr;
  };
  const prodRows=(its)=>{
    const lines=[];
    for(let i=0;i<its.length;i+=2){
      const c1=fmtCol(its[i].producto,its[i].precio,C1);
      const c2=its[i+1]?' '+fmtCol(its[i+1].producto,its[i+1].precio,C2):'';
      lines.push(c1+c2);
    }
    return lines;
  };

  const vs=visitas.filter(v=>v.cuenta_id===cuenta.id).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const pf={};vs.forEach(v=>{(pf[v.fecha]=pf[v.fecha]||[]).push(v);});

  const rows=[];
  rows.push('');
  rows.push(ctr('ESTADO DE CUENTA'));
  rows.push(ctr('--- FIADO ---'));
  rows.push(sep('-'));
  rows.push('Cliente : '+cli.nombre);
  rows.push(sep('-'));

  Object.entries(pf).forEach(([fecha,vsDelDia])=>{
    const td=vsDelDia.reduce((s,v)=>s+parseFloat(v.total_visita||0),0);
    rows.push('');
    rows.push(lineRL(fechaDisplay(fecha),'S/'+fmtNum(td)));
    rows.push(sep('.'));
    vsDelDia.forEach((v,idx)=>{
      const its=items.filter(it=>it.visita_id===v.id);
      if(vsDelDia.length>1) rows.push(' Visita '+(idx+1)+':');
      prodRows(its).forEach(r=>rows.push(r));
      if(vsDelDia.length>1){
        const sub=its.reduce((s,it)=>s+parseFloat(it.precio||0),0);
        rows.push(lineRL(' Subtotal','S/'+fmtNum(sub)));
      }
    });
  });

  const pg=pagos.filter(p=>p.cuenta_id===cuenta.id);
  if(pg.length){
    rows.push('');rows.push(sep('-'));
    rows.push(ctr('ABONOS'));
    pg.forEach(p=>rows.push(lineRL(fechaDisplay(p.fecha)+(p.nota?' ('+p.nota+')':''),'-S/'+fmtNum(p.monto))));
  }

  rows.push('');rows.push(sep('='));
  rows.push(lineRL('SALDO A PAGAR','S/'+fmtNum(cuenta.saldo)));
  rows.push(sep('='));
  rows.push('');
  rows.push(ctr('Gracias por su preferencia'));
  rows.push('');rows.push('');

  const texto=rows.join('\n');
  if(navigator.share){
    navigator.share({title:'Ticket — '+cli.nombre, text:texto})
      .then(()=>showToast('Selecciona RawBT'))
      .catch(e=>{ if(e.name!=='AbortError') showToast('Error: '+e.message); });
  } else {
    const blob=new Blob([texto],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='ticket.prn';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Abre el archivo en RawBT');
  }
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
init();
</script>
</body>
</html>
